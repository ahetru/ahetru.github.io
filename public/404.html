<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axel Hetru — Junior Backend Developer</title>
  <script>
    const path = window.location.pathname
    const segments = path.replace(/^\/+|\/+$/g, '').split('/')
    const rest = segments.filter(s => !['fr', 'en', 'es'].includes(s)).join('/')
    const locale = localStorage.getItem('locale') || 'en'
    const base = '/' + locale + '/' + rest
    const hash = window.location.hash
    window.location.replace(base + (rest ? '' : '') + hash || '/' + locale + '/')
  </script>
</head>
<body>
</body>
</html>
