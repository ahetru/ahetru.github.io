<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axel Hetru</title>
  <meta name="description" content="Axel Hetru, software developer trained at 42 Barcelona.">
  <link rel="alternate" hreflang="en" href="https://ahetru.github.io/en/">
  <link rel="alternate" hreflang="fr" href="https://ahetru.github.io/fr/">
  <link rel="alternate" hreflang="x-default" href="https://ahetru.github.io/">
  <script>
    var lang = null;
    try { lang = localStorage.getItem('lang'); } catch (e) {}
    if (lang !== 'en' && lang !== 'fr') {
      lang = /^fr\b/i.test(navigator.language || '') ? 'fr' : 'en';
    }
    location.replace('/' + lang + '/' + location.search + location.hash);
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/en/"></noscript>
</head>
<body>
  <p><a href="/en/">English</a> · <a href="/fr/">Français</a></p>
</body>
</html>
